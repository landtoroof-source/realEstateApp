services:
  - type: web
    name: realEstateApp
    env: python
    runtime: python
    pythonVersion: 3.13.2
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false          # set manually in Render dashboard
      - key: ADMIN_SECRET
        sync: false
